# pyproject.toml

[build-system]
requires      = ['setuptools>=61.0.0', 'wheel']
build-backend = 'setuptools.build_meta'

[project]
name = 'bless'
version = '0.0.1'
description = 'BLESSing the world'
readme = {file = 'README.md', content-type = 'text/markdown'}
authors = [{ name = 'Maxim Borisyak', email = 'maxim.borisyak@gmail.com' }]
license = { file = 'LICENSE' }
classifiers = [
  'Programming Language :: Python',
  'Programming Language :: Python :: 3',
]
keywords = ['Machine Learning', 'jax']
dependencies = [
  'numpy>=1.25.0',
  'jax>=0.4.0',
  'optax>=0.2.0'
]
requires-python = '>=3.11'

[project.optional-dependencies]
dev = [
]

[project.urls]
Homepage = 'none'

[tool.setuptools.packages.find]
exclude = ['contrib', 'examples', 'docs', 'tests']

[tool.ruff.lint]
### no import ordering, no sorted __all__
ignore = ['I001', 'RUF022']
