### The campaign the Snakefile runs: datasets per (library, seed), then one `scripts/fit.py fit` per (library, model)
### with every seed in one process. The protocol is config/fit.yaml.
root: data/campaign

libraries:
- regulatory
- chain
- ecoli-monod
- ecoli-oxidative
- ecoli

### patterns against the expanded library entries: the baseline, BLESS, its single-head variants and the width-matched
### memoryless correctors
models:
- baseline
- bless-[0-9].*
- sequential-bless-[0-9].*
- residual-bless-[0-9].*
- sequential-[0-9].*
- residual-[0-9].*
- sequential-residual-[0-9].*

