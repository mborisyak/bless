### Truth `ecoli2024` vs the Monod base `ecoli-monod` (one glucose route, no oxygen); dt 5e-3 truth, 1e-2 fitted.
__name__: 'ecoli-monod'

ground-truth:
  model:
    ecoli2024: {}
  profiles: ['ecoli2024.realistic', 'ecoli2024.controls', 'ecoli2024.likelihood']
  solver:
    rkc2:
      dt: 5.0e-3
      T: 24.0
      stages: 4

baseline:
  model:
    ecoli-monod: {}
  profiles: ['ecoli-monod.realistic', 'ecoli2024.controls', 'ecoli2024.likelihood']
  regularization: 1.0e-6
  solver:
    rkc2:
      dt: 1.0e-2
      T: 24.0
      stages: 4

### BLESS, latent 4, 12 hidden units; the memoryless correctors below are widened to its extension parameter count
bless:
  __template__:
    model:
      blessed-ecoli-monod:
        profiles: ['ecoli-monod.realistic']
        latent: $UNITS.LATENT
        units: $UNITS.UNITS
    profiles: ['bless.common', 'ecoli2024.controls', 'ecoli2024.likelihood']
    regularization: $REG
    solver:
      rkc2:
        dt: 1.0e-2
        T: 24.0
        stages: 4

  __values__:
    UNITS:
      4w12: { LATENT: 4, UNITS: [12, ] }
    REG: {reg3: 1.0e-3}



### linear BLESS, its latent size matched to the extension parameter count of BLESS
lin-bless:
  __template__:
    model:
      lin-blessed-ecoli-monod:
        profiles: ['ecoli-monod.realistic']
        latent: $LATENT
        # A_z_z = -U U^T - min_eigen I: every latent mode decays at least at this rate, 1/h
        min_eigen: 1.0e-2
    profiles: ['lin-bless.common', 'ecoli2024.controls', 'ecoli2024.likelihood']
    regularization: $REG
    solver:
      rkc2:
        dt: 1.0e-2
        T: 24.0
        stages: 4

  __values__:
    LATENT: {15: 15}
    REG: {reg3: 1.0e-3}



residual:
  __template__:
    model:
      residual-ecoli-monod:
        profiles: ['ecoli-monod.realistic']
        units: $UNITS
    profiles: ['residual.common', 'ecoli2024.controls', 'ecoli2024.likelihood']
    regularization: $REG
    solver:
      rkc2:
        dt: 1.0e-2
        T: 24.0
        stages: 4

  __values__:
    UNITS: {77: [77, ]}
    REG: {reg3: 1.0e-3}




sequential:
  __template__:
    model:
      sequential-ecoli-monod:
        profiles: ['ecoli-monod.realistic']
        units: $UNITS
    profiles: ['sequential.common', 'ecoli2024.controls', 'ecoli2024.likelihood']
    regularization: $REG
    solver:
      rkc2:
        dt: 1.0e-2
        T: 24.0
        stages: 4

  __values__:
    UNITS: {55: [55, ]}
    REG: {reg3: 1.0e-3}



### BLESS without the latent state: both heads on the coupled states, widened to the extension parameter count of BLESS
sequential-residual:
  __template__:
    model:
      sequential-residual-ecoli-monod:
        profiles: ['ecoli-monod.realistic']
        units: $UNITS
    profiles: ['sequential-residual.common', 'ecoli2024.controls', 'ecoli2024.likelihood']
    regularization: $REG
    solver:
      rkc2:
        dt: 1.0e-2
        T: 24.0
        stages: 4

  __values__:
    UNITS: {32: [32, ]}
    REG: {reg3: 1.0e-3}



### BLESS with the parameter head alone: the latent state corrects the coupled parameters, no residual rates
sequential-bless:
  __template__:
    model:
      sequential-blessed-ecoli-monod:
        profiles: ['ecoli-monod.realistic']
        latent: $UNITS.LATENT
        units: $UNITS.UNITS
    profiles: ['bless.common', 'ecoli2024.controls', 'ecoli2024.likelihood']
    regularization: $REG
    solver:
      rkc2:
        dt: 1.0e-2
        T: 24.0
        stages: 4

  __values__:
    UNITS:
      4w17: { LATENT: 4, UNITS: [17, ] }   # width-matched to BLESS 4w12
    REG: {reg3: 1.0e-3}

### BLESS with the residual head alone: the latent state drives residual rates, the parameters stay the base's
residual-bless:
  __template__:
    model:
      residual-blessed-ecoli-monod:
        profiles: ['ecoli-monod.realistic']
        latent: $UNITS.LATENT
        units: $UNITS.UNITS
    profiles: ['bless.common', 'ecoli2024.controls', 'ecoli2024.likelihood']
    regularization: $REG
    solver:
      rkc2:
        dt: 1.0e-2
        T: 24.0
        stages: 4

  __values__:
    UNITS:
      4w19: { LATENT: 4, UNITS: [19, ] }   # width-matched to BLESS 4w12
    REG: {reg3: 1.0e-3}
