### Truth `ecoli2024` vs the Monod base `ecoli-monod` (one glucose route, no oxygen); dt 5e-3 truth, 1e-2 fitted.
__name__: 'ecoli-monod'

ground-truth:
  model:
    ecoli2024: {}
  profiles: ['ecoli2024.realistic', 'ecoli2024.controls', 'ecoli2024.likelihood']
  solver:
    rkc2:
      dt: 5.0e-3
      T: 24.0
      stages: 4

baseline:
  model:
    ecoli-monod: {}
  profiles: ['ecoli-monod.realistic', 'ecoli2024.controls', 'ecoli2024.likelihood']
  regularization: 1.0e-6
  solver:
    rkc2:
      dt: 1.0e-2
      T: 24.0
      stages: 4

### BLESS at a quarter, half, base (latent 4, 12 hidden units) and double capacity; the other models matched to its
### extension parameter count at each capacity, every capacity at three regularisation strengths
bless:
  __template__:
    model:
      blessed-ecoli-monod:
        profiles: ['ecoli-monod.realistic']
        latent: $UNITS.LATENT
        units: $UNITS.UNITS
    profiles: ['bless.common', 'ecoli2024.controls', 'ecoli2024.likelihood']
    regularization: $REG
    solver:
      rkc2:
        dt: 1.0e-2
        T: 24.0
        stages: 4

  __values__:
    UNITS:
      1w3: { LATENT: 1, UNITS: [3, ] }
      2w6: { LATENT: 2, UNITS: [6, ] }
      4w12: { LATENT: 4, UNITS: [12, ] }
      8w24: { LATENT: 8, UNITS: [24, ] }
    REG: {reg1: 1.0e-1, reg2: 1.0e-2, reg3: 1.0e-3}



### linear BLESS, its latent size matched to the extension parameter count of BLESS at each capacity
lin-bless:
  __template__:
    model:
      lin-blessed-ecoli-monod:
        profiles: ['ecoli-monod.realistic']
        latent: $LATENT
        # A_z_z lower triangular, its diagonal -min_eigen - softplus(.): every latent mode decays at least at this rate, 1/h
        min_eigen: 1.0e-2
    profiles: ['lin-bless.common', 'ecoli2024.controls', 'ecoli2024.likelihood']
    regularization: $REG
    solver:
      rkc2:
        dt: 1.0e-2
        T: 24.0
        stages: 4

  __values__:
    LATENT: {4: 4, 8: 8, 15: 15, 29: 29}
    REG: {reg1: 1.0e-1, reg2: 1.0e-2, reg3: 1.0e-3}



residual:
  __template__:
    model:
      residual-ecoli-monod:
        profiles: ['ecoli-monod.realistic']
        units: $UNITS
    profiles: ['residual.common', 'ecoli2024.controls', 'ecoli2024.likelihood']
    regularization: $REG
    solver:
      rkc2:
        dt: 1.0e-2
        T: 24.0
        stages: 4

  __values__:
    UNITS: {13: [13, ], 29: [29, ], 77: [77, ], 230: [230, ]}
    REG: {reg1: 1.0e-1, reg2: 1.0e-2, reg3: 1.0e-3}




sequential:
  __template__:
    model:
      sequential-ecoli-monod:
        profiles: ['ecoli-monod.realistic']
        units: $UNITS
    profiles: ['sequential.common', 'ecoli2024.controls', 'ecoli2024.likelihood']
    regularization: $REG
    solver:
      rkc2:
        dt: 1.0e-2
        T: 24.0
        stages: 4

  __values__:
    UNITS: {9: [9, ], 21: [21, ], 55: [55, ], 164: [164, ]}
    REG: {reg1: 1.0e-1, reg2: 1.0e-2, reg3: 1.0e-3}



### BLESS without the latent state: both heads on the coupled states, widened to the extension parameter count of BLESS
sequential-residual:
  __template__:
    model:
      sequential-residual-ecoli-monod:
        profiles: ['ecoli-monod.realistic']
        units: $UNITS
    profiles: ['sequential-residual.common', 'ecoli2024.controls', 'ecoli2024.likelihood']
    regularization: $REG
    solver:
      rkc2:
        dt: 1.0e-2
        T: 24.0
        stages: 4

  __values__:
    UNITS: {5: [5, ], 12: [12, ], 32: [32, ], 95: [95, ]}
    REG: {reg1: 1.0e-1, reg2: 1.0e-2, reg3: 1.0e-3}



### BLESS with the parameter head alone: the latent state corrects the coupled parameters, no residual rates
sequential-bless:
  __template__:
    model:
      sequential-blessed-ecoli-monod:
        profiles: ['ecoli-monod.realistic']
        latent: $UNITS.LATENT
        units: $UNITS.UNITS
    profiles: ['bless.common', 'ecoli2024.controls', 'ecoli2024.likelihood']
    regularization: $REG
    solver:
      rkc2:
        dt: 1.0e-2
        T: 24.0
        stages: 4

  __values__:
    UNITS:
      1w5: { LATENT: 1, UNITS: [5, ] }
      2w9: { LATENT: 2, UNITS: [9, ] }
      4w17: { LATENT: 4, UNITS: [17, ] }
      8w33: { LATENT: 8, UNITS: [33, ] }
    REG: {reg1: 1.0e-1, reg2: 1.0e-2, reg3: 1.0e-3}

### BLESS with the residual head alone: the latent state drives residual rates, the parameters stay the base's
residual-bless:
  __template__:
    model:
      residual-blessed-ecoli-monod:
        profiles: ['ecoli-monod.realistic']
        latent: $UNITS.LATENT
        units: $UNITS.UNITS
    profiles: ['bless.common', 'ecoli2024.controls', 'ecoli2024.likelihood']
    regularization: $REG
    solver:
      rkc2:
        dt: 1.0e-2
        T: 24.0
        stages: 4

  __values__:
    UNITS:
      1w6: { LATENT: 1, UNITS: [6, ] }
      2w10: { LATENT: 2, UNITS: [10, ] }
      4w19: { LATENT: 4, UNITS: [19, ] }
      8w35: { LATENT: 8, UNITS: [35, ] }
    REG: {reg1: 1.0e-1, reg2: 1.0e-2, reg3: 1.0e-3}
