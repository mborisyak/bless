### Inhibitory-chain truth `chain` (observes `A`) vs the Monod base `monod`, scored with the base's likelihood; dt 5e-3 for truth and fitted models.
__name__: 'chain'



ground-truth:
  model:
    chain: {}
  profiles: ['chain.common', 'monod.likelihood']
  solver:
    rkc2:
      dt: 5.0e-3
      T: 1.0
      stages: 4



baseline:
  model:
    monod: {}
  profiles: ['monod.common', 'chain.common', 'monod.likelihood']
  regularization: 1.0e-6
  solver:
    rkc2:
      dt: 5.0e-3
      T: 1.0
      stages: 4



### BLESS at a quarter, half, base (latent 4, 12 hidden units) and double capacity; the other models matched to its
### extension parameter count at each capacity, every capacity at three regularisation strengths
bless:
  __template__:
    model:
      blessed-monod:
        profiles: ['monod.common']
        latent: $UNITS.LATENT
        units: $UNITS.UNITS
    profiles: ['bless.common', 'chain.common', 'monod.likelihood']
    regularization: $REG
    solver:
      rkc2:
        dt: 5.0e-3
        T: 1.0
        stages: 4

  __values__:
    UNITS:
      1w3: { LATENT: 1, UNITS: [3, ] }
      2w6: { LATENT: 2, UNITS: [6, ] }
      4w12: { LATENT: 4, UNITS: [12, ] }
      8w24: { LATENT: 8, UNITS: [24, ] }
    REG: {reg1: 1.0e-1, reg2: 1.0e-2, reg3: 1.0e-3}



### linear BLESS, its latent size matched to the extension parameter count of BLESS at each capacity
lin-bless:
  __template__:
    model:
      lin-blessed-monod:
        profiles: ['monod.common']
        latent: $LATENT
        # A_z_z lower triangular, its diagonal -min_eigen - softplus(.): every latent mode decays at least at this rate, per unit time
        min_eigen: 1.0e-2
    profiles: ['lin-bless.common', 'chain.common', 'monod.likelihood']
    regularization: $REG
    solver:
      rkc2:
        dt: 5.0e-3
        T: 1.0
        stages: 4

  __values__:
    LATENT: {4: 4, 8: 8, 15: 15, 29: 29}
    REG: {reg1: 1.0e-1, reg2: 1.0e-2, reg3: 1.0e-3}



residual:
  __template__:
    model:
      residual-monod:
        profiles: ['monod.common']
        units: $UNITS
    profiles: ['residual.common', 'chain.common', 'monod.likelihood']
    regularization: $REG
    solver:
      rkc2:
        dt: 5.0e-3
        T: 1.0
        stages: 4

  __values__:
    UNITS: {14: [14, ], 36: [36, ], 103: [103, ], 334: [334, ]}
    REG: {reg1: 1.0e-1, reg2: 1.0e-2, reg3: 1.0e-3}




sequential:
  __template__:
    model:
      sequential-monod:
        profiles: ['monod.common']
        units: $UNITS
    profiles: ['sequential.common', 'chain.common', 'monod.likelihood']
    regularization: $REG
    solver:
      rkc2:
        dt: 5.0e-3
        T: 1.0
        stages: 4

  __values__:
    UNITS: {10: [10, ], 27: [27, ], 77: [77, ], 250: [250, ]}
    REG: {reg1: 1.0e-1, reg2: 1.0e-2, reg3: 1.0e-3}



### BLESS without the latent state: both heads on the coupled states, widened to the extension parameter count of BLESS
sequential-residual:
  __template__:
    model:
      sequential-residual-monod:
        profiles: ['monod.common']
        units: $UNITS
    profiles: ['sequential-residual.common', 'chain.common', 'monod.likelihood']
    regularization: $REG
    solver:
      rkc2:
        dt: 5.0e-3
        T: 1.0
        stages: 4

  __values__:
    UNITS: {6: [6, ], 15: [15, ], 44: [44, ], 143: [143, ]}
    REG: {reg1: 1.0e-1, reg2: 1.0e-2, reg3: 1.0e-3}



### BLESS with the parameter head alone: the latent state corrects the coupled parameters, no residual rates
sequential-bless:
  __template__:
    model:
      sequential-blessed-monod:
        profiles: ['monod.common']
        latent: $UNITS.LATENT
        units: $UNITS.UNITS
    profiles: ['bless.common', 'chain.common', 'monod.likelihood']
    regularization: $REG
    solver:
      rkc2:
        dt: 5.0e-3
        T: 1.0
        stages: 4

  __values__:
    UNITS:
      1w4: { LATENT: 1, UNITS: [4, ] }
      2w9: { LATENT: 2, UNITS: [9, ] }
      4w17: { LATENT: 4, UNITS: [17, ] }
      8w33: { LATENT: 8, UNITS: [33, ] }
    REG: {reg1: 1.0e-1, reg2: 1.0e-2, reg3: 1.0e-3}

### BLESS with the residual head alone: the latent state drives residual rates, the parameters stay the base's
residual-bless:
  __template__:
    model:
      residual-blessed-monod:
        profiles: ['monod.common']
        latent: $UNITS.LATENT
        units: $UNITS.UNITS
    profiles: ['bless.common', 'chain.common', 'monod.likelihood']
    regularization: $REG
    solver:
      rkc2:
        dt: 5.0e-3
        T: 1.0
        stages: 4

  __values__:
    UNITS:
      1w5: { LATENT: 1, UNITS: [5, ] }
      2w9: { LATENT: 2, UNITS: [9, ] }
      4w18: { LATENT: 4, UNITS: [18, ] }
      8w34: { LATENT: 8, UNITS: [34, ] }
    REG: {reg1: 1.0e-1, reg2: 1.0e-2, reg3: 1.0e-3}
