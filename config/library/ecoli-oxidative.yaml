### Truth `ecoli2024` vs the oxidative base `ecoli2024oxidative` (oxidative route only); dt 5e-3 truth, 1e-2 fitted.
__name__: 'ecoli-oxidative'




ground-truth:
  model:
    ecoli2024: {}
  profiles: ['ecoli2024.realistic', 'ecoli2024.controls', 'ecoli2024.likelihood']
  solver:
    rkc2:
      dt: 5.0e-3
      T: 24.0
      stages: 4



baseline:
  model:
    ecoli2024oxidative: {}
  profiles: ['ecoli2024oxidative.realistic', 'ecoli2024.controls', 'ecoli2024.likelihood']
  regularization: 1.0e-6
  solver:
    rkc2:
      dt: 1.0e-2
      T: 24.0
      stages: 4



### BLESS at a quarter, half, base (latent 4, 12 hidden units) and double capacity; the other models matched to its
### extension parameter count at each capacity, every capacity at three regularisation strengths
bless:
  __template__:
    model:
      blessed-ecoli-oxidative:
        profiles: ['ecoli2024oxidative.realistic']
        latent: $UNITS.LATENT
        units: $UNITS.UNITS
    profiles: ['bless.common', 'ecoli2024.controls', 'ecoli2024.likelihood']
    regularization: $REG
    solver:
      rkc2:
        dt: 1.0e-2
        T: 24.0
        stages: 4

  __values__:
    UNITS:
      1w3: { LATENT: 1, UNITS: [3, ] }
      2w6: { LATENT: 2, UNITS: [6, ] }
      4w12: { LATENT: 4, UNITS: [12, ] }
      8w24: { LATENT: 8, UNITS: [24, ] }
    REG: {reg1: 1.0e-1, reg2: 1.0e-2, reg3: 1.0e-3}



### linear BLESS, its latent size matched to the extension parameter count of BLESS at each capacity
lin-bless:
  __template__:
    model:
      lin-blessed-ecoli-oxidative:
        profiles: ['ecoli2024oxidative.realistic']
        latent: $LATENT
        # A_z_z lower triangular, its diagonal -min_eigen - softplus(.): every latent mode decays at least at this rate, 1/h
        min_eigen: 1.0e-2
    profiles: ['lin-bless.common', 'ecoli2024.controls', 'ecoli2024.likelihood']
    regularization: $REG
    solver:
      rkc2:
        dt: 1.0e-2
        T: 24.0
        stages: 4

  __values__:
    LATENT: {3: 3, 8: 8, 15: 15, 29: 29}
    REG: {reg1: 1.0e-1, reg2: 1.0e-2, reg3: 1.0e-3}



residual:
  __template__:
    model:
      residual-ecoli-oxidative:
        profiles: ['ecoli2024oxidative.realistic']
        units: $UNITS
    profiles: ['residual.common', 'ecoli2024.controls', 'ecoli2024.likelihood']
    regularization: $REG
    solver:
      rkc2:
        dt: 1.0e-2
        T: 24.0
        stages: 4

  __values__:
    UNITS: {11: [11, ], 25: [25, ], 64: [64, ], 181: [181, ]}
    REG: {reg1: 1.0e-1, reg2: 1.0e-2, reg3: 1.0e-3}



sequential:
  __template__:
    model:
      sequential-ecoli-oxidative:
        profiles: ['ecoli2024oxidative.realistic']
        units: $UNITS
    profiles: ['sequential.common', 'ecoli2024.controls', 'ecoli2024.likelihood']
    regularization: $REG
    solver:
      rkc2:
        dt: 1.0e-2
        T: 24.0
        stages: 4

  __values__:
    UNITS: {9: [9, ], 19: [19, ], 49: [49, ], 141: [141, ]}
    REG: {reg1: 1.0e-1, reg2: 1.0e-2, reg3: 1.0e-3}

### BLESS without the latent state: both heads on the coupled states, widened to the extension parameter count of BLESS
sequential-residual:
  __template__:
    model:
      sequential-residual-ecoli-oxidative:
        profiles: ['ecoli2024oxidative.realistic']
        units: $UNITS
    profiles: ['sequential-residual.common', 'ecoli2024.controls', 'ecoli2024.likelihood']
    regularization: $REG
    solver:
      rkc2:
        dt: 1.0e-2
        T: 24.0
        stages: 4

  __values__:
    UNITS: {5: [5, ], 11: [11, ], 27: [27, ], 79: [79, ]}
    REG: {reg1: 1.0e-1, reg2: 1.0e-2, reg3: 1.0e-3}



### BLESS with the parameter head alone: the latent state corrects the coupled parameters, no residual rates
sequential-bless:
  __template__:
    model:
      sequential-blessed-ecoli-oxidative:
        profiles: ['ecoli2024oxidative.realistic']
        latent: $UNITS.LATENT
        units: $UNITS.UNITS
    profiles: ['bless.common', 'ecoli2024.controls', 'ecoli2024.likelihood']
    regularization: $REG
    solver:
      rkc2:
        dt: 1.0e-2
        T: 24.0
        stages: 4

  __values__:
    UNITS:
      1w5: { LATENT: 1, UNITS: [5, ] }
      2w9: { LATENT: 2, UNITS: [9, ] }
      4w17: { LATENT: 4, UNITS: [17, ] }
      8w34: { LATENT: 8, UNITS: [34, ] }
