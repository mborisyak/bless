    profiles: ['bless.common', 'ecoli2024.controls', 'ecoli2024.likelihood']
    regularization: $REG
    solver:
      rkc2:
        dt: 1.0e-2
        T: 24.0
        stages: 4

  __values__:
    UNITS:
      1w5: { LATENT: 1, UNITS: [5, ] }
      2w10: { LATENT: 2, UNITS: [10, ] }
      4w19: { LATENT: 4, UNITS: [19, ] }
      8w36: { LATENT: 8, UNITS: [36, ] }
